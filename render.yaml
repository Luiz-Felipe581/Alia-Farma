services:
  - type: web
    name: alia-farma
    runtime: node
    plan: free
    buildCommand: npm install
    startCommand: npm start
    healthCheckPath: /healthz
    envVars:
      - key: NODE_VERSION
        value: 20
      - key: JWT_SECRET
        generateValue: true
      - key: ADMIN_EMAIL
        sync: false
      - key: ADMIN_PASSWORD
        sync: false
    # Para guardar os dados entre reinicializações (exige plano pago):
    # disk:
    #   name: dados
    #   mountPath: /var/data
    # e crie a variável DATA_DIR=/var/data
